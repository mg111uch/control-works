<!DOCTYPE html>
<html>
<head>
    <title>Binary Star System</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script >

// Scene, camera, and renderer setup
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Camera position
camera.position.z = 50;

// Create two stars (spheres)
const star1Geometry = new THREE.SphereGeometry(2, 32, 32); // Radius, width segments, height segments
const star1Material = new THREE.MeshBasicMaterial({ color: 0xff0000 }); // Red star
const star1 = new THREE.Mesh(star1Geometry, star1Material);
scene.add(star1);

const star2Geometry = new THREE.SphereGeometry(1.5, 32, 32); // Smaller star
const star2Material = new THREE.MeshBasicMaterial({ color: 0xffff00 }); // Yellow star
const star2 = new THREE.Mesh(star2Geometry, star2Material);
scene.add(star2);

// Add a light source (to simulate star glow, though MeshBasicMaterial doesn’t need it)
const light = new THREE.PointLight(0xffffff, 1, 100);
light.position.set(0, 0, 10);
scene.add(light);

// Orbital parameters
const distance = 10; // Distance between stars (arbitrary units)
const speed = 0.02; // Orbital speed
let angle = 0; // Angle for circular orbit

// Animation loop
function animate() {
    requestAnimationFrame(animate);

    // Update star positions (simple circular orbit around center)
    angle += speed;

    // Star 1 orbit (larger star, closer to center of mass)
    star1.position.x = Math.cos(angle) * distance * 0.4; // 0.4 factor since it’s heavier
    star1.position.y = Math.sin(angle) * distance * 0.4;

    // Star 2 orbit (smaller star, farther from center of mass)
    star2.position.x = Math.cos(angle + Math.PI) * distance * 0.6; // Opposite side (Math.PI)
    star2.position.y = Math.sin(angle + Math.PI) * distance * 0.6;

    // Render the scene
    renderer.render(scene, camera);
}

// Start animation
animate();

// Handle window resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

    </script>
</body>
</html>
